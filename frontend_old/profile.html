<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AuthApp - Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                Auth<span>App</span>
            </a>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="profile.html" class="active">
                    Profile
                </a>

                <a href="login.html">
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- PROFILE PAGE -->
    <main class="profile-page">

        <div class="profile-card">

            <div class="profile-avatar">
                U
            </div>

            <p class="badge">
                User Profile
            </p>

            <h1>
                Welcome 👋
            </h1>

            <p class="profile-text">
                You have successfully logged in to your
                AuthApp account.
            </p>


            <div class="profile-info">

                <div class="info-box">

                    <span>
                        Status
                    </span>

                    <strong>
                        Logged In
                    </strong>

                </div>


                <div class="info-box">

                    <span>
                        Account
                    </span>

                    <strong>
                        User
                    </strong>

                </div>

            </div>


            <a
                href="index.html"
                class="btn secondary-btn profile-home-btn"
            >
                Back to Home
            </a>

        </div>

    </main>

</body>

</html>
